[build]
  publish = "."

[[redirects]]
  from = "/aboutus"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/tours"
  to = "/tours-northeast-india.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/destination"
  to = "/destination.html"
  status = 301
  force = true

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 301
  force = true

[[redirects]]
  from = "/posts/trek-to-glow-lake"
  to = "/eastern-arunachal-multi-activity-tour-2026.html"
  status = 301

[[redirects]]
  from = "/tours/cycle-tour-of-meghalaya"
  to = "/cycle-tour-of-meghalaya.html"
  status = 301

[[redirects]]
  from = "/tours/cycle-tour-trans-meghalaya"
  to = "/cycle-tour-of-meghalaya.html"
  status = 301

[[redirects]]
  from = "/tours/cycle-tour-of-assam"
  to = "/cycle-tour-assam.html"
  status = 301

[[redirects]]
  from = "/tours/departure-cycle-tour-road-to-anini"
  to = "/cycle-tour-of-mishmi-hills-arunachal-pradesh.html"
  status = 301

[[redirects]]
  from = "/tours/walking-tour-meghalaya"
  to = "/walking-tour-meghalaya.html"
  status = 301

[[redirects]]
  from = "/tours/walking-holiday-eastern-arunachal-pradesh"
  to = "/walking-holiday-eastern-arunachal-pradesh.html"
  status = 301

[[redirects]]
  from = "/tours/family-holiday-assam"
  to = "/family-holiday-assam.html"
  status = 301

[[redirects]]
  from = "/tours/motorcycle-overland-northeast"
  to = "/motorcycle-tour-5-states-northeast-india.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
